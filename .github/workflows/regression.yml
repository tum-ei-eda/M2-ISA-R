name: Regression tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_minres:
        description: Run differential tests against MINRES CoreDSL 2.0.21
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install package
        run: python -m pip install -e .
      - name: Run Python and CoreDSL regression tests
        run: python -m unittest discover -s tests -v

  minres-tests:
    if: ${{ inputs.run_minres == true || vars.COREDSL_MINRES_CI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install package
        run: python -m pip install -e .
      - name: Download pinned MINRES validator
        shell: bash
        env:
          COREDSL_VALIDATOR_JAR: ${{ runner.temp }}/com.minres.coredsl.validator-2.0.21.jar
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 \
            https://github.com/Minres/CoreDSL/releases/download/2.0.21/com.minres.coredsl.validator-2.0.21.jar \
            --output "$COREDSL_VALIDATOR_JAR"
          echo "9ee16edcb8feb36f3154067ac2f5f3986f3e5d25cd7122f5986ef7c4bcaee4d3  $COREDSL_VALIDATOR_JAR" | sha256sum --check --strict
      - name: Run regression tests including MINRES comparisons
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee minres-tests.log
      - name: Upload comparison log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: minres-tests-log
          path: minres-tests.log
          if-no-files-found: ignore
